<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Brace Curatello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F5; --paper:#FFFFFF; --ink:#132235; --muted:#55657A; --line:#CCD7E2; --soft:#F4F7FA;
  --accent:#1D4F7C; --accent-ink:#FFFFFF; --accent-soft:#E2ECF5;
  --amber:#A86412; --amber-soft:#FBF1E2; --danger:#B3261E;
  --c-moral:#5257C2; --c-sexual:#C2185B; --c-sexiste:#D9741A; --c-discri:#00897B; --c-violence:#C62828; --c-repr:#3949AB; --c-droits:#7E6A00; --c-autre:#607D8B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --paper:#16212D; --ink:#E4ECF4; --muted:#93A4B8; --line:#2A3846; --soft:#1C2835;
    --accent:#8FC1EC; --accent-ink:#0C1824; --accent-soft:#1E3247; --amber:#F0B25E; --amber-soft:#33260F; --danger:#F28B82;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --paper:#16212D; --ink:#E4ECF4; --muted:#93A4B8; --line:#2A3846; --soft:#1C2835;
  --accent:#8FC1EC; --accent-ink:#0C1824; --accent-soft:#1E3247; --amber:#F0B25E; --amber-soft:#33260F; --danger:#F28B82;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-weight:400}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.brand h1{font-size:1.15rem}
.brand p{margin:0;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1rem}

nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
nav.tabs button{border:0;background:none;padding:9px 4px;cursor:pointer;color:var(--muted);font-weight:500;border-radius:10px;font-size:.88rem}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);padding:11px 16px;border-radius:12px;cursor:pointer;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 12px;font-size:.86rem;min-height:36px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:6px 0;font-weight:500}

.banner{background:var(--amber-soft);border:1.5px solid var(--amber);color:var(--ink);padding:12px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.muted{color:var(--muted)}
.small-txt{font-size:.86rem}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center}
.empty h2{font-size:1.2rem;margin-bottom:8px}

/* Login */
.gate{max-width:420px;margin:6vh auto 0}
.gate .mark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;margin-bottom:14px}
.gate h1{font-size:1.5rem;margin-bottom:6px}
.seg-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:4px;margin:18px 0}
.seg-tabs button{border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg-tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(19,34,53,.12)}
.pw{position:relative}
.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:1.5px solid var(--line);background:var(--paper);color:var(--accent);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:.82rem}
.banner.resume{background:var(--accent-soft);border-color:var(--accent)}
.warn-box{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:8px;font-size:.88rem;margin:4px 0 14px}

/* Filters + timeline */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.list{list-style:none;margin:0;padding:0}
.item{margin-bottom:10px}
.card{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.cal{background:var(--accent-soft);color:var(--accent);border-radius:10px;text-align:center;padding:6px 2px;align-self:start}
.cal .d{font-size:1.4rem;font-weight:700;line-height:1.1}
.cal .m{font-size:.72rem;font-weight:500}
.card .who{font-weight:700}
.card .desc{margin:2px 0 8px;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;padding:2px 9px;border-radius:6px;color:#fff;font-weight:500}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}

/* Form */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.steps span{height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.step-label{font-size:.84rem;color:var(--muted);margin-bottom:12px}
.panel h2{font-size:1.25rem;margin-bottom:14px}
.field{margin-bottom:16px}
.field > label,.field > .lbl{display:block;font-weight:700;margin-bottom:6px}
.hint{font-size:.84rem;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=month],textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);font-size:16px}
textarea{min-height:140px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--soft);font-size:.92rem}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cat-opt{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--soft)}
.cat-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cat-opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.cat-opt b{display:flex;align-items:center;gap:8px}
.cat-opt small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.cat-opt .ref{font-size:.76rem;color:var(--muted);font-style:italic}
.witness{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--soft)}
.witness .row2{margin-bottom:8px}
.form-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.err{color:var(--danger);font-size:.88rem;margin-top:6px}
.tr-box{border:1.5px dashed var(--accent);border-radius:12px;padding:10px;margin-top:10px;background:var(--accent-soft)}
.tr-box label{font-size:.84rem;font-weight:700;display:block;margin-bottom:6px}
.tr-box textarea{background:var(--paper);min-height:110px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--soft)}
.files{list-style:none;padding:0;margin:12px 0 0}
.files li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--paper)}
.files .badge{width:44px;height:44px;border-radius:8px;background:var(--soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--muted)}
.files .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}

/* Detail */
.detail dt{font-size:.8rem;color:var(--muted);margin-top:14px}
.detail dd{margin:2px 0 0;white-space:pre-wrap}
.detail .fr{border-left:3px solid var(--accent);padding-left:10px;margin-top:8px;color:var(--ink)}
.stamp{font-size:.8rem;color:var(--muted);border-top:1.5px solid var(--line);margin-top:18px;padding-top:10px}
.media{display:grid;gap:10px;margin-top:6px}
.media figure{margin:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.media img,.media video{width:100%;max-height:360px;object-fit:contain;display:block;background:#000}
.media audio{width:100%;display:block;padding:8px}
.media .ph{height:70px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.media figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-size:.8rem;border-top:1.5px solid var(--line);background:var(--paper)}
.media figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Report */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:1.6rem;font-weight:700;line-height:1.1;color:var(--accent)}
.stat .l{font-size:.82rem;color:var(--muted)}
.bars{list-style:none;padding:0;margin:0}
.bars li{display:grid;grid-template-columns:minmax(110px,1fr) 1.6fr 28px;align-items:center;gap:10px;margin-bottom:8px;font-size:.88rem}
.bars .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bars .fill{display:block;height:100%;border-radius:5px}
.section{margin-top:14px}
.section h3{font-size:1.02rem;margin-bottom:10px}
.sec-h{font-size:1.05rem;margin:22px 0 4px}
.help li{margin-bottom:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:90vw;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 8px 20px rgba(19,52,85,.3);border-radius:16px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} nav.tabs button{font-size:.8rem} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const b64 = buf => { const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); };

const enc = new TextEncoder(), dec = new TextDecoder();

/* =================== CIFRADO =================== */
async function deriveKey(secret, salt){
 const base = await crypto.subtle.importKey("raw", enc.encode(secret.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptBytes(key, bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes); return {iv, ct:new Uint8Array(ct)}; }
async function decryptBytes(key, box){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:box.iv},key,box.ct)); }
const encryptJSON = (key,obj) => encryptBytes(key, enc.encode(JSON.stringify(obj)));
const decryptJSON = async (key,box) => JSON.parse(dec.decode(await decryptBytes(key,box)));
async function checkKey(key, ver){ try{ return dec.decode(await decryptBytes(key,ver))==="cuaderno-ok"; }catch(e){ return false; } }

/* =================== INDEXEDDB =================== */
let idbP=null;
function idb(){ if(!idbP) idbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open("cuaderno-incidentes",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){rej(e)} }); return idbP; }
async function tx(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const x=db.transaction("kv",mode); const st=x.objectStore("kv"); let out; const r=fn(st); if(r) r.onsuccess=()=>{out=r.result}; x.oncomplete=()=>res(out); x.onerror=()=>rej(x.error); x.onabort=()=>rej(x.error); }); }
const kvGet = k => tx("readonly", st=>st.get(k));
const kvSet = (k,v) => tx("readwrite", st=>st.put(v,k));
const kvDel = k => tx("readwrite", st=>st.delete(k));
const kvKeys = () => tx("readonly", st=>st.getAllKeys());

/* =================== CUADERNO =================== */
async function createBook(name, secret){
 const id=norm(name);
 if(await kvGet("p:"+id)) throw "exists";
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const key=await deriveKey(secret,salt);
 const ver=await encryptBytes(key, enc.encode("cuaderno-ok"));
 const profile={id, name:name.trim(), salt, ver, createdAt:new Date().toISOString(), lastBackup:null};
 await kvSet("p:"+id, profile);
 await kvSet("d:"+id, await encryptJSON(key,{incidents:[]}));
 return {profile,key};
}
async function openBook(name, secret){
 const id=norm(name);
 const profile=await kvGet("p:"+id);
 if(!profile) throw "nobook";
 const key=await deriveKey(secret, profile.salt);
 if(!(await checkKey(key, profile.ver))) throw "wrong";
 return {profile,key};
}
const OPEN_SECRET="brace-sin-clave", DEFAULT_ID="mi-cuaderno";
const openKey = salt => deriveKey(OPEN_SECRET, salt);
async function autoOpen(){
 const ids=(await kvKeys()).filter(k=>typeof k==="string"&&k.startsWith("p:"));
 for(const k of ids){ const p=await kvGet(k); const key=await openKey(p.salt); if(await checkKey(key,p.ver)) return {profile:p,key}; }
 if(ids.length) return null; // hay un cuaderno antiguo con clave
 const salt=crypto.getRandomValues(new Uint8Array(16)), key=await openKey(salt);
 const profile={id:DEFAULT_ID, name:"", salt, ver:await encryptBytes(key,enc.encode("cuaderno-ok")), createdAt:new Date().toISOString(), lastBackup:null};
 await kvSet("p:"+DEFAULT_ID, profile); await kvSet("d:"+DEFAULT_ID, await encryptJSON(key,{incidents:[]}));
 return {profile,key};
}
// Vuelve a cifrar todo con la clave interna fija (sin palabra secreta)
async function rekey(profile, oldKey){
 const salt=crypto.getRandomValues(new Uint8Array(16)), key=await openKey(salt), id=profile.id;
 const keys=(await kvKeys()).filter(k=>typeof k==="string"&&(k==="d:"+id||k==="dr:"+id||k.startsWith("f:"+id+":")));
 for(const k of keys){ const box=await kvGet(k); if(box) await kvSet(k, await encryptBytes(key, await decryptBytes(oldKey,box))); }
 profile.salt=salt; profile.ver=await encryptBytes(key,enc.encode("cuaderno-ok"));
 await kvSet("p:"+id, profile);
 return key;
}

}

async function loadPending(){ try{ const box=await kvGet(draftKey()); S.pending = box ? await decryptJSON(S.key,box) : null; }catch(e){ S.pending=null; } }
async function parkDraft(){ if(!S.draft) return; await flushDraft(); S.pending=draftSnapshot(); S.draft=null; S.newFiles=[]; S.removedFiles=[]; }
async function discardPending(){ const p=S.pending; if(p){ for(const fid of p.newFiles||[]){ try{await kvDel(fileKey(fid))}catch(e){} } } await clearDraftStore(); }
async function takeOverPending(){ if(!S.pending) return true; if(!confirm(t("discardConfirm"))) return false; await discardPending(); return true; }

async function lock(msg){

 render(); if(msg) toast(msg);

/* =================== COPIA / RESTAURACIÓN =================== */
const box64 = b => ({iv:b64(b.iv), ct:b64(b.ct)});
const unbox64 = b => ({iv:unb64(b.iv), ct:unb64(b.ct)});
async function buildBackup(){
 const files={};
 const prefix="f:"+S.profile.id+":";
 for(const k of await kvKeys()){ if(typeof k==="string" && k.startsWith(prefix)){ files[k.slice(prefix.length)] = box64(await kvGet(k)); } }
 return JSON.stringify({app:"cuaderno-incidentes", v:1, name:S.profile.name, exportedAt:new Date().toISOString(), salt:b64(S.profile.salt), ver:box64(S.profile.ver), data:box64(await kvGet("d:"+S.profile.id)), files});
}
async function doBackup(){
 S.busy=true; render();
 try{
  const json=await buildBackup();
  const ok=await saveFile(`cuaderno-copia-${new Date().toISOString().slice(0,10)}.json`, new Blob([json],{type:"application/json"}));
  if(ok){ S.profile.lastBackup=new Date().toISOString(); await kvSet("p:"+S.profile.id, S.profile); }
 }catch(e){ toast(t("dlFail")); }
 S.busy=false; render();
}
async function readBackupFile(file){
 try{
  const o=JSON.parse(await file.text());
  if(o.app!=="cuaderno-incidentes"||!o.salt||!o.ver||!o.data) throw 0;
  S.restore={obj:o, needPw:!(await checkKey(await openKey(unb64(o.salt)), unbox64(o.ver)))}; S.restoreErr="";
 }catch(e){ S.restore=null; S.restoreErr=t("badBackup"); }
 render();
}
async function applyRestore(secret){
 const o=S.restore.obj, needPw=S.restore.needPw;
 const salt=unb64(o.salt), ver=unbox64(o.ver);
 let key=needPw ? await deriveKey(secret,salt) : await openKey(salt);
 if(!(await checkKey(key,ver))) throw "wrong";
 const id=S.profile?S.profile.id:DEFAULT_ID;
 const existing=await kvGet("p:"+id);
 if(existing && S.incidents.length && !confirm(t("confirmReplace"))) throw "cancel";
 // Reemplazo total: borrar todo lo de este cuaderno
 const prefix="f:"+id+":";
 for(const k of await kvKeys()){ if(typeof k==="string" && k.startsWith(prefix)) await kvDel(k); }
 await kvDel("dr:"+id); S.pending=null; S.draft=null;
 const profile={id, name:o.name||"", salt, ver, createdAt:existing?.createdAt||new Date().toISOString(), lastBackup:o.exportedAt||null};
 await kvSet("p:"+id, profile);
 await kvSet("d:"+id, unbox64(o.data));
 for(const [fid,b] of Object.entries(o.files||{})) await kvSet(prefix+fid, unbox64(b));
 if(needPw) key=await rekey(profile, key);
 for(const u of urlCache.values()) URL.revokeObjectURL(u); urlCache.clear();
 S.profile=profile; S.key=key; await loadIncidents();
 S.restore=null; S.view="list"; bumpLock();
}

async function saveFile(filename, blob){
 if(downloadsNs){
  try{ await downloadsNs.save({filename, data:blob}); return true; }
  catch(e){ toast(e&&e.code==="declined"?t("declined"):(e&&e.code==="rejected_extension"?t("dlBlocked"):t("dlFail"))); return false; }
 }
 try{ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return true; }
 catch(e){ toast(t("dlFail")); return false; }
}

const LNAME={es:"español",fr:"francés"};
const otherL = l => l==="es"?"fr":"es";
async function translateAll(){
 const d=S.draft, src=d.origLang||"es", dst=otherL(src);
 const fields=["description","impact"].filter(f=>(d[f]||"").trim());
 if(!fields.length){ S.trErr=t("trEmpty"); render(); return; }
 S.trAll=true; S.trErr=""; render();
 try{
  for(const f of fields){
   const prompt = "Traduce al "+LNAME[dst]+" el siguiente texto escrito en "+LNAME[src]+". Es un relato personal de un incidente en el trabajo, escrito en primera persona. Conserva exactamente el sentido, los hechos, las fechas y el tono. Las citas entre comillas deben traducirse fielmente y mantener las comillas. No añadas, no resumas, no suavices, no comentes. Devuelve únicamente la traducción, sin ningún texto adicional.\n\nTexto:\n" + d[f].trim();
   const r = await sampleNs(prompt, {modelTier:"default", cache:false});
   d[f+"_tr"]=(r.text||"").trim();
  }
 }catch(e){ if(e && e.code==="not_granted") sampleNs=null; S.trErr=t("trFail"); }
 S.trAll=false; render();
}

}
function render(){

 const app=document.getElementById("app");
 const langSw = `<div class="lang" role="group" aria-label="Idioma / Langue"><button data-act="lang" data-v="es" aria-pressed="${S.lang==="es"}">ES</button><button data-act="lang" data-v="fr" aria-pressed="${S.lang==="fr"}">FR</button></div>`;
 if(S.view==="loading"){ app.innerHTML=`<p class="muted" style="text-align:center;margin-top:40px">${t("opening")}</p>`; return; }

  <div class="top-actions">${langSw}</div></header>`;
 const isList=["list","form","detail"].includes(S.view);
 const tabs = `<nav class="tabs">${[["list","tabList"],["report","tabReport"],["backup","tabBackup"],["help","tabHelp"]].map(([v,k])=>`<button data-act="tab" data-v="${v}" ${(S.view===v||(v==="list"&&isList)||(v==="backup"&&S.view==="restore"))?'aria-current="page"':""}>${t(k)}</button>`).join("")}</nav>`;
 let body="";

 else if(S.view==="detail") body=viewDetail();
 else if(S.view==="report") body=viewReport();
 else if(S.view==="backup") body=viewBackup();
 else if(S.view==="restore") body=viewRestore();
 else if(S.view==="help") body=viewHelp();
 const fab = S.view==="list" ? `<button class="btn primary fab" data-act="new">＋ ${t("add")}</button>` : "";

function validate(upTo){ S.errors={}; const dm=S.draft.dateMode||"exact"; if(upTo>=1&&dm==="exact"&&!S.draft.date) S.errors.date=true; if(upTo>=1&&dm==="month"&&!S.draft.month) S.errors.month=true; if(upTo>=2&&!S.draft.description.trim()) S.errors.description=true; return !Object.keys(S.errors).length; }
async function saveDraft(){
 if(!validate(2)){ S.step=(S.errors.date||S.errors.month)?1:2; render(); return; }
 const now=new Date().toISOString(), d=S.draft, ex=S.incidents.find(x=>x.id===d.id);
 const inc={...d, id:d.id||rid("inc-"), createdAt:ex?.createdAt||now, updatedAt:now, witnesses:d.witnesses.filter(w=>(w.name||"").trim()||(w.contact||"").trim())};
 if(inc.dateMode!=="exact"){ inc.date=""; inc.time=""; } else inc.dateClue="";
 if(inc.dateMode!=="month") inc.month="";
 const prev=S.incidents;
 S.incidents = ex ? S.incidents.map(x=>x.id===inc.id?inc:x) : [...S.incidents, inc];
 try{
  await writeIncidents();
  for(const fid of S.removedFiles){ try{await kvDel(fileKey(fid))}catch(e){} }
  S.newFiles=[]; S.removedFiles=[]; S.draft=null; await clearDraftStore(); S.view="detail"; S.detailId=inc.id; render(); toast(t("saved"));
 }catch(e){ S.incidents=prev; toast("Error"); }
}
async function cancelDraft(){
 await clearDraftStore();
 for(const fid of S.newFiles){ try{await kvDel(fileKey(fid))}catch(e){} }
 S.newFiles=[]; S.removedFiles=[]; S.draft=null; S.trErr="";
 S.view = S.editingId ? "detail" : "list"; render();
}
async function addFiles(list){
 for(const file of list){
  if(file.size>MAX){ toast(`${t("tooLarge")}: ${file.name}`); continue; }
  S.saving++; render();
  try{ const fid=await putFile(file); S.draft.files.push({id:fid,name:file.name,type:file.type||"",size:file.size,at:new Date().toISOString()}); S.newFiles.push(fid); }
  catch(e){ toast("Error: "+file.name); }
  S.saving--; render();
 }
}

 }

 if(el.id==="rep-name"){ S.profile.name=el.value; clearTimeout(nameTimer); nameTimer=setTimeout(()=>kvSet("p:"+S.profile.id,S.profile).catch(()=>{}),600); return; }
 if(!S.draft) return;
 if(el.dataset.bind && el.type!=="checkbox" && el.type!=="radio") S.draft[el.dataset.bind]=el.value;
 else if(el.dataset.w!==undefined && el.type!=="radio") S.draft.witnesses[+el.dataset.w][el.dataset.wf]=el.value;
 queueDraftSave();
});
document.addEventListener("change", e=>{
 const el=e.target;
 if(el.dataset.act==="rlang"){ S.reportLang=el.value; return; }
 if(el.dataset.act==="incOrig"){ S.includeOrig=el.checked; return; }
 if(el.id==="f-files"){ addFiles([...el.files]); el.value=""; return; }
 if(el.id==="f-restore"){ if(el.files[0]) readBackupFile(el.files[0]); el.value=""; return; }
 if(!S.draft) return;
 if(el.dataset.bind && el.type==="checkbox"){ S.draft[el.dataset.bind]=el.checked; if(el.dataset.bind==="reportedDone") render(); }
 else if(el.dataset.bind && el.type==="radio"){ S.draft[el.dataset.bind]=el.value; if(el.dataset.bind==="origLang"||el.dataset.bind==="dateMode") render(); }
 else if(el.dataset.w!==undefined && el.type==="radio") S.draft.witnesses[+el.dataset.w][el.dataset.wf]=el.value;
 else if(el.dataset.cat){ const c=el.dataset.cat; S.draft.categories = el.checked ? [...new Set([...S.draft.categories,c])] : S.draft.categories.filter(x=>x!==c); }
 if(S.draft) queueDraftSave();
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.target.id==="g-sec"||e.target.id==="g-sec2"||e.target.id==="g-name")) document.querySelector('[data-act="gateGo"]')?.click(); });

/* =================== INICIO =================== */
render(); start();
if(window.claude && typeof window.claude.use==="function"){
 window.claude.use("downloads").then(n=>{downloadsNs=n;}).catch(()=>{});
 window.claude.use("sample").then(n=>{sampleNs=n; if(S.view==="form") render();}).catch(()=>{});
}
})();
</script>
</body>
</html>
